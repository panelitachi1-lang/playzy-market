<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D9FFF"/>
      <stop offset="100%" stop-color="#1A6FE8"/>
    </linearGradient>
  </defs>
  <!-- Иконка-квадрат -->
